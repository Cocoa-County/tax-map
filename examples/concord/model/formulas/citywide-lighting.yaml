id: citywide-lighting
name: Citywide street lighting assessment
district: citywide-lighting
fiscal_year: 2026-27
description: Equivalent dwelling units (EDU) from the County land-use code times the per-EDU rate.
inputs:
- name: use_code
  label: County land-use code
  source:
    parcel: USE_CODE
- name: private_street
  label: Single-family home on a private street (1 = yes)
  default: 0.0
  caveat: Not in the parcel data. Private-street homes drop the 0.25 security factor (0.75 EDU).
constants:
  rate:
    value: 25.0
    label: Rate per EDU
    unit: $/EDU
    evidence:
    - resource: citywide-lighting-report-2026-27
      page: 15
      locator: Part D, printed p. 11
