terms:
- name: EDU
  label: Equivalent dwelling units
  expression: if(private_street == 1 and lookup(edu, use_code) == 1, 0.75, lookup(edu, use_code))
expression: round(rate * EDU, 2)
caveats:
- Government-owned and State Board parcels are assessed only on the portion developed for business use.
- Individual mobile homes are not assessed; the underlying parcel is.
evidence:
- resource: citywide-lighting-report-2026-27
  page: 15
  locator: Part D, printed pp. 11-12
