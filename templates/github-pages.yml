# Copy to .github/workflows/pages.yml in a taxmap project repository to
# publish the map site with GitHub Pages (Settings > Pages > Source: GitHub Actions).
name: Publish map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install taxmap
        run: pip install "taxmap @ git+https://github.com/Cocoa-County/tax-map"
      # Parcel geometry is usually not committed; fetch it from the configured source.
      - name: Download parcels
        run: taxmap --project . gis download parcels
      - name: Validate
        run: taxmap --project . validate
      - name: Build site
        run: taxmap --project . build --output site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
