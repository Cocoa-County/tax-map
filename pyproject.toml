[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxmap"
version = "0.2.0"
description = "Agent-driven platform for building tax and special-assessment maps from public documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.2",
  "pydantic>=2.6",
  "pyyaml>=6",
  "pypdf>=4",
  "pdfplumber>=0.11",
  "shapely>=2.0",
  "pyproj>=3.6",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
taxmap = "taxmap.cli:main"
taxmap-mcp = "taxmap.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taxmap = ["site/static/**/*", "site/static/*", "project/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
