<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tax map</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1 id="title">Tax map</h1>
      <p id="subtitle"></p>
    </div>
    <div class="search">
      <label class="visually-hidden" for="search-input">Search by APN or address</label>
      <input id="search-input" type="search" placeholder="Search APN or address" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-controls="search-results" aria-expanded="false">
      <ul id="search-results" class="search-results" role="listbox" hidden></ul>
      <div id="search-status" class="search-status" role="status" hidden></div>
    </div>
    <nav class="actions" aria-label="Explore this map">
      <button type="button" id="open-districts" class="ghost">Districts</button>
      <button type="button" id="open-sources" class="ghost">Sources</button>
      <button type="button" id="open-about" class="ghost">About</button>
    </nav>
  </header>
  <main class="layout">
    <div id="map" aria-label="Parcel map"></div>
    <div id="zoom-hint" class="zoom-hint" hidden>Zoom in to see parcels</div>
    <button type="button" id="open-panel" class="map-panel-toggle" aria-controls="panel" aria-expanded="false">Explore parcels</button>
    <aside id="panel" class="panel" aria-label="Parcel details" hidden>
      <div class="panel-toolbar">
        <span>Parcel details</span>
        <button type="button" class="ghost sheet-handle" id="sheet-handle" aria-label="Expand parcel details" aria-expanded="false">Expand</button>
        <button type="button" class="ghost" id="close-panel" aria-label="Hide parcel details">&times;</button>
      </div>
      <div id="panel-body"></div>
    </aside>
  </main>
  <dialog id="title-modal" class="title-modal" aria-labelledby="intro-title" aria-describedby="intro-subtitle intro-disclaimer">
    <h2 id="intro-title"></h2>
    <p id="intro-subtitle"></p>
    <p id="intro-disclaimer" class="muted"></p>
    <form method="dialog">
      <button type="submit" autofocus>Explore the map</button>
    </form>
    <hr class="intro-divider">
    <div class="intro-credits">
      <p class="intro-powered">Powered by
        <a class="taxmap-attribution" href="https://cocoa-county.github.io/tax-map/">
          <span>taxmap <small>by Cocoa County</small></span>
          <span class="taxmap-mug" aria-hidden="true"></span>
        </a>
      </p>
      <p class="intro-credit">Created by Nick Spinner</p>
      <nav class="intro-links" aria-label="Creator and taxmap links">
        <a href="https://www.linkedin.com/in/spinnernicholas/" target="_blank" rel="noopener noreferrer" class="icon-button" title="LinkedIn" aria-label="LinkedIn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/></svg>
        </a>
        <a href="https://github.com/Spinnernicholas" target="_blank" rel="noopener noreferrer" class="icon-button" title="GitHub" aria-label="GitHub">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        </a>
        <a href="https://github.com/Cocoa-County/tax-map" target="_blank" rel="noopener noreferrer" class="icon-button" title="Source Code" aria-label="Source Code">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M9.4 16.6L4.8 12l4.6-4.6M14.6 16.6l4.6-4.6-4.6-4.6M6.7 19.8h10.6M6.7 4.2h10.6" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </a>
      </nav>
    </div>
  </dialog>
  <dialog id="modal" class="modal" aria-labelledby="modal-title">
    <form method="dialog" class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="ghost close" aria-label="Close">&times;</button>
    </form>
    <div id="modal-body" class="modal-body"></div>
  </dialog>
  <footer class="site-footer">
    <span id="disclaimer" class="disclaimer"></span>
    <a class="taxmap-attribution" href="https://cocoa-county.github.io/tax-map/" aria-label="Built with taxmap by Cocoa County">
      <span>taxmap <small>by Cocoa County</small></span>
      <span class="taxmap-mug" aria-hidden="true"></span>
    </a>
  </footer>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="formula.js"></script>
  <script src="formula-display.js"></script>
  <script src="parcel-hit.js"></script>
  <script src="app.js"></script>
</body>
</html>
